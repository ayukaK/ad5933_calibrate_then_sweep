# Core
CONFIG_MAIN_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_PINCTRL=y

# USB CDC ACM (creates COM port)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="nRF52840 CDC"

# Console over USB (NOT UART pins)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_USB_UART_CONSOLE=y

# IMPORTANT: disable UART console when using USB console
CONFIG_UART_CONSOLE=n
