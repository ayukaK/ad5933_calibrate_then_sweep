# ================= Core =================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ================= I2C =================
CONFIG_I2C=y
CONFIG_I2C_NRFX=y
CONFIG_PINCTRL=y

# ================= Logging / Console =================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CBPRINTF_COMPLETE=y

CONFIG_CONSOLE=y
CONFIG_SERIAL=y

# Disable UART console (we want USB CDC console)
CONFIG_UART_CONSOLE=n

# Use USB CDC ACM as the console device -> COM port
CONFIG_USB_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# ================= USB (IMPORTANT: pick ONE stack) =================
CONFIG_USB=y

# Legacy USB device stack ON
CONFIG_USB_DEVICE_STACK=y

# New USB "device_next" stack OFF (this avoids the duplicate symbols)
CONFIG_USB_DEVICE_STACK_NEXT=n

# CDC ACM class ON
CONFIG_USB_CDC_ACM=y

# Optional but nice: don’t suspend USB
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# ================= Misc =================
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
